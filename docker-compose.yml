# TV30: the unified Compose file of the solution root.
#
# Linux (full container): docker compose up -d
#   Defaults come from .env (COMPOSE_PROFILES=mqtt,linux, DOCKERHUB_NS,
#   IMAGE_TAG, EDGE_VARIANT).
#
# Development, with the infrastructure in containers and one module on the
# host (npm run dev): docs/dev-local.md and scripts/test-dev-host.sh.

# Fixed name: independent of the folder of the clone, so down and up from
# different clones reach the same containers.
name: tv30

include:
  - infra/docker-compose.yml

services:

  # DNS and port diagnosis before startup. It blocks (exit 1, and the edge
  # does not start) only when 44642 (C.3.4) is held by another process. Host
  # network and pid, to see who holds each port.
  preflight:
    image: alpine:3
    container_name: tv30-preflight
    network_mode: host
    pid: host
    environment:
      # Active profiles, from the root .env or the shell; a profile enabled only
      # by --profile on the command line does not appear here.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      AOP_PUBLIC_PORT: ${AOP_PUBLIC_PORT:-8080}
    volumes:
      - ./scripts/preflight.sh:/preflight.sh:ro
    command: sh /preflight.sh
    restart: "no"

  # Seeds ./user-files from the template: on every up, copies the missing
  # files, without overwriting anything.
  userfiles-seed:
    image: alpine:3
    container_name: tv30-userfiles-seed
    volumes:
      - ./user-files:/user-files
      - ./infra/user-files-template:/template:ro
      - ./scripts/seed-user-files.sh:/seed.sh:ro
    command: sh /seed.sh
    restart: "no"

  # Self-signed X.509 certificate of the receiver, generated on the first
  # startup in .tv30/tls (infra/edgegateway/tls-init.sh, in the edge image).
  tls-init:
    image: ${DOCKERHUB_NS:-tv30}/tv30-edgegateway:${IMAGE_TAG:-latest}
    container_name: tv30-tls-init
    entrypoint: ["sh", "/usr/local/bin/tv30-tls-init"]
    environment:
      TLS_DIR: /tls
    volumes:
      - ./.tv30/tls:/tls
    restart: "no"

  # Sets net.bridge.bridge-nf-call-iptables=0. With a read-only sysctl (e.g.
  # Docker Desktop), it fails silently and exits 0.
  sysctl-init:
    profiles: ["linux"]
    image: alpine:3
    container_name: tv30-sysctl-init
    privileged: true
    network_mode: host
    command: >
      sh -c "sysctl -w net.bridge.bridge-nf-call-iptables=0 2>/dev/null || echo 'sysctl skipped (read-only or unsupported kernel)'"
    restart: "no"

  tv3ws:
    profiles: ["linux"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-tv3ws:${IMAGE_TAG:-dev}
    build:
      context: ./tv3ws
      dockerfile: ../infra/dockerfiles/tv3ws.Dockerfile
      additional_contexts:
        tv30-data:    ./infra/user-files-template
        tv30-scripts: ./infra/dockerfiles
    container_name: tv3ws
    networks: [ginga_net]
    ports:
      # 44652 and 44653 are not published. The range of the remote-device
      # WebSockets is published.
      - "45000-45199:45000-45199"
    environment:
      MQTT_HOST: mqtt-broker
      HTTP_PORT: 44652
      HTTPS_PORT: 44653
      # Every interface inside the container.
      TV3WS_LISTEN_HOST: "0.0.0.0"
      # Receiver certificate.
      TV30_TLS_DIR: /tls
      # Host of the WebSocket returned by /tv3/remote-device.
      SERVER_URL: ${SERVER_URL:-localhost}
      # Port range of the remote-device WebSockets.
      WS_PORT_MIN: 45000
      WS_PORT_MAX: 45199
      # Port draws before giving up on opening a WebSocket server (version
      # 100.0).
      LISTEN_ATTEMPTS: 10
      # Receiver limit on registered remote devices (version 100.0).
      MAX_REGISTRATIONS: 32
      # Interval of the keep-alive ping on the WebSockets, in ms (version
      # 100.0).
      PING_INTERVAL_MS: 15000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Object proxy of aop-cc, inside the network, and the domain of the
      # application origins (ctx-<h>.<APPS_DOMAIN>): the files of ABNT NBR
      # 25608, C.6.4.7.
      OBJECT_PROXY_URL: http://aop-cc:8081/
      APPS_DOMAIN: ${APPS_DOMAIN:-apps.localhost}
      USER_THUMBS:    /user-files/thumbs
      # Development default; set it in the root .env or the shell. `environment`
      # prevails over env_file, so a JWT_SECRET in tv3ws/.env has no effect.
      JWT_SECRET: ${JWT_SECRET:-tv30-dev-secret-nao-usar-em-producao}
      JWT_ISSUER: ${JWT_ISSUER:-GenericIssuer}
    env_file:
      # Optional. HTTPS_KEY/HTTPS_CERT apply only without the certificate of
      # TV30_TLS_DIR (tv3ws/src/tls.ts).
      - path: ./tv3ws/.env
        required: false
      # Root .env, which prevails over tv3ws/.env: it carries
      # SSDP_ADVERTISE_HOST, EDGE_HTTP_PORT, EDGE_HTTPS_PORT and the other keys
      # of the root .env. Not in environment on purpose: there, even an empty
      # value would override the one of tv3ws/.env. A value only exported in the
      # shell does not arrive through here.
      - path: ./.env
        required: false
    volumes:
      - ./user-files:/user-files
      - ./.tv30/tls:/tls:ro
    depends_on:
      # redis is healthy only after the initial load (key seed:done).
      redis:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
      userfiles-seed:
        condition: service_completed_successfully
      tls-init:
        condition: service_completed_successfully
    restart: unless-stopped

  aop-shell:
    profiles: ["linux"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-aop-shell:${IMAGE_TAG:-dev}
    build:
      context: ./aop-shell
      dockerfile: ../infra/dockerfiles/aop-shell.Dockerfile
      additional_contexts:
        tv30-data:    ./infra/user-files-template
        tv30-scripts: ./infra/dockerfiles
    container_name: aop-shell
    networks: [ginga_net]
    ports:
      # Public port of the AoP, fixed (default 8080); inside the container the
      # port is 8080. The MQTT over WebSocket of the TV page (/mqtt) goes
      # through it too.
      - "${AOP_PUBLIC_PORT:-8080}:8080"
    environment:
      PORT: 8080
      # A broadcast application opens on the origin of its Application
      # Context ID, served by the object proxy of aop-cc,
      # http://ctx-<h>.<APPS_DOMAIN>:<OBJECT_PROXY_PUBLIC_PORT>. *.localhost
      # resolves to the machine of whoever opens the page.
      APPS_DOMAIN: ${APPS_DOMAIN:-apps.localhost}
      AOP_PUBLIC_PORT: ${AOP_PUBLIC_PORT:-8080}
      OBJECT_PROXY_PUBLIC_PORT: ${OBJECT_PROXY_PUBLIC_PORT:-8081}
      MQTT_HOST: mqtt-broker
      # Internal port of mqtt-broker on ginga_net, the target of /mqtt.
      MQTT_WS_PORT: "9001"
      USER_DATA_PATH: /user-files
      REDIS_HOST: redis
    volumes:
      - ./user-files:/user-files
    depends_on:
      - mqtt-broker
      - redis
      - userfiles-seed
    restart: unless-stopped

  # Broadcaster side simulator: live streams of the declared services. The
  # host port is fixed because players reach the MPD BaseURL and the
  # playlists through it.
  bcast-sim:
    profiles: ["linux"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-bcast-sim:${IMAGE_TAG:-dev}
    build:
      context: ./bcast-sim
    container_name: bcast-sim
    networks: [ginga_net]
    ports:
      - "${LIVE_PUBLIC_PORT:-8082}:8082"
    environment:
      PORT: 8082
      EMISSION_DIR: /emission
      LIVE_BASE_URL: http://localhost:${LIVE_PUBLIC_PORT:-8082}/live/
      SERVICES_BASE_URL: http://bcast-sim:8082/services/
      SIGNALING_BASE_URL: http://bcast-sim:8082/signaling/
    volumes:
      - ./bcast-sim/example:/emission:ro
    restart: unless-stopped

  # Common Core of the platform: acquires the transport layer signaling the
  # broadcaster side serves and publishes it on retained topics; its object
  # proxy serves the broadcast objects of each service with a carousel and the
  # origins of the broadcast and broadband applications, published on
  # OBJECT_PROXY_PUBLIC_PORT (default 8081).
  aop-cc:
    profiles: ["linux"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-aop-cc:${IMAGE_TAG:-dev}
    build:
      context: ./aop-cc
    container_name: aop-cc
    networks: [ginga_net]
    # The object proxy passes a broadband application on from its server; a
    # server on the host is reached as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MQTT_HOST: mqtt-broker
      REDIS_HOST: redis
      SIGNALING_BASE_URL: http://bcast-sim:8082/signaling/
      OBJECT_PROXY_PORT: 8081
      OBJECT_PROXY_PUBLIC_PORT: ${OBJECT_PROXY_PUBLIC_PORT:-8081}
      APPS_DOMAIN: ${APPS_DOMAIN:-apps.localhost}
      CACHE_PORT: 8082
      CACHE_QUOTA_BYTES: ${CACHE_QUOTA_BYTES:-112000000}
      CACHE_TOTAL_BYTES: ${CACHE_TOTAL_BYTES:-500000000}
    ports:
      - "${OBJECT_PROXY_PUBLIC_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
      bcast-sim:
        condition: service_started
    restart: unless-stopped
