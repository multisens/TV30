# TV30: the unified Compose file of the solution root.
#
# Linux (full container): docker compose up -d
#   Defaults come from .env (COMPOSE_PROFILES=mqtt,linux, DOCKERHUB_NS,
#   IMAGE_TAG, EDGE_VARIANT).
#
# Development, with the infrastructure in containers and one module on the
# host (npm run dev): docs/dev-local.md and scripts/test-dev-host.sh.

# Fixed name: independent of the folder of the clone, so down and up from
# different clones reach the same containers.
name: tv30

include:
  - infra/docker-compose.yml

services:

  # DNS and port diagnosis before startup. It blocks (exit 1, and the edge
  # does not start) only when 44642 (C.3.4) is held by another process. Host
  # network and pid, to see who holds each port.
  preflight:
    image: alpine:3
    container_name: tv30-preflight
    network_mode: host
    pid: host
    environment:
      # Active profiles, from the root .env or the shell; a profile enabled only
      # by --profile on the command line does not appear here.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      AOP_PUBLIC_PORT: ${AOP_PUBLIC_PORT:-8080}
    volumes:
      - ./scripts/preflight.sh:/preflight.sh:ro
    command: sh /preflight.sh
    restart: "no"

  # Seeds ./user-files from the template: on every up, copies the missing
  # files, without overwriting anything.
  userfiles-seed:
    image: alpine:3
    container_name: tv30-userfiles-seed
    volumes:
      - ./user-files:/user-files
      - ./infra/user-files-template:/template:ro
      - ./scripts/seed-user-files.sh:/seed.sh:ro
    command: sh /seed.sh
    restart: "no"

  # Self-signed X.509 certificate of the receiver, generated on the first
  # startup in .tv30/tls (infra/edgegateway/tls-init.sh, in the edge image).
  tls-init:
    image: ${DOCKERHUB_NS:-tv30}/tv30-edgegateway:${IMAGE_TAG:-latest}
    container_name: tv30-tls-init
    entrypoint: ["sh", "/usr/local/bin/tv30-tls-init"]
    environment:
      TLS_DIR: /tls
    volumes:
      - ./.tv30/tls:/tls
    restart: "no"

  # Sets net.bridge.bridge-nf-call-iptables=0. With a read-only sysctl (e.g.
  # Docker Desktop), it fails silently and exits 0.
  sysctl-init:
    profiles: ["linux"]
    image: alpine:3
    container_name: tv30-sysctl-init
    privileged: true
    network_mode: host
    command: >
      sh -c "sysctl -w net.bridge.bridge-nf-call-iptables=0 2>/dev/null || echo 'sysctl skipped (read-only or unsupported kernel)'"
    restart: "no"

  tv3ws:
    profiles: ["linux"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-tv3ws:${IMAGE_TAG:-dev}
    build:
      context: ./tv3ws
      dockerfile: ../infra/dockerfiles/tv3ws.Dockerfile
      additional_contexts:
        tv30-data:    ./infra/user-files-template
        tv30-scripts: ./infra/dockerfiles
    container_name: tv3ws
    networks: [ginga_net]
    ports:
      # 44652 and 44653 are not published. The range of the remote-device
      # WebSockets is published.
      - "45000-45199:45000-45199"
    environment:
      MQTT_HOST: mosquitto
      HTTP_PORT: 44652
      HTTPS_PORT: 44653
      # Every interface inside the container.
      TV3WS_LISTEN_HOST: "0.0.0.0"
      # Receiver certificate.
      TV30_TLS_DIR: /tls
      # Host of the WebSocket returned by /tv3/remote-device.
      SERVER_URL: ${SERVER_URL:-localhost}
      # Port range of the remote-device WebSockets.
      WS_PORT_MIN: 45000
      WS_PORT_MAX: 45199
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_THUMBS:    /user-files/thumbs
      # Development default; set it in the root .env or the shell. `environment`
      # prevails over env_file, so a JWT_SECRET in tv3ws/.env has no effect.
      JWT_SECRET: ${JWT_SECRET:-tv30-dev-secret-nao-usar-em-producao}
      JWT_ISSUER: ${JWT_ISSUER:-GenericIssuer}
    env_file:
      # Optional. HTTPS_KEY/HTTPS_CERT apply only without the certificate of
      # TV30_TLS_DIR (tv3ws/src/tls.ts).
      - path: ./tv3ws/.env
        required: false
      # Root .env, which prevails over tv3ws/.env: it carries
      # SSDP_ADVERTISE_HOST, EDGE_HTTP_PORT, EDGE_HTTPS_PORT and the other keys
      # of the root .env. Not in environment on purpose: there, even an empty
      # value would override the one of tv3ws/.env. A value only exported in the
      # shell does not arrive through here.
      - path: ./.env
        required: false
    volumes:
      - ./user-files:/user-files
      - ./.tv30/tls:/tls:ro
    depends_on:
      # redis is healthy only after the initial load (key seed:done).
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      userfiles-seed:
        condition: service_completed_successfully
      tls-init:
        condition: service_completed_successfully
    restart: unless-stopped

  aop:
    profiles: ["linux"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-aop:${IMAGE_TAG:-dev}
    build:
      context: ./aop
      dockerfile: ../infra/dockerfiles/aop.Dockerfile
      additional_contexts:
        tv30-data:    ./infra/user-files-template
        tv30-scripts: ./infra/dockerfiles
    container_name: aop
    networks: [ginga_net]
    extra_hosts:
      # host.docker.internal on Linux, for a bcast on the host.
      - "host.docker.internal:host-gateway"
    ports:
      # Public port of the AoP, fixed (default 8080); inside the container the
      # port is 8080. The MQTT over WebSocket of the TV page (/mqtt) goes
      # through it too.
      - "${AOP_PUBLIC_PORT:-8080}:8080"
    environment:
      PORT: 8080
      # Each application opens on its own origin,
      # http://<app>.<APPS_DOMAIN>:<AOP_PUBLIC_PORT>. *.localhost resolves to
      # the machine of whoever opens the page.
      APPS_DOMAIN: ${APPS_DOMAIN:-apps.localhost}
      AOP_PUBLIC_PORT: ${AOP_PUBLIC_PORT:-8080}
      MQTT_HOST: mosquitto
      # Internal port of mosquitto on ginga_net, the target of /mqtt.
      MQTT_WS_PORT: "9001"
      USER_DATA_PATH: /user-files
      REDIS_HOST: redis
    volumes:
      - ./user-files:/user-files
    depends_on:
      - mosquitto
      - redis
      - userfiles-seed
    restart: unless-stopped

  bcast:
    profiles: ["linux"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-bcast:${IMAGE_TAG:-dev}
    build:
      context: ./bcast
      dockerfile: ../infra/dockerfiles/bcast.Dockerfile
    container_name: bcast
    networks: [ginga_net]
    ports:
      # A host port chosen by Docker by default (docker compose port bcast
      # 8081); BCAST_PUBLISH=8081:8081 fixes it.
      - "${BCAST_PUBLISH:-8081}"
    environment:
      PORT: 8081
      MQTT_HOST: mosquitto
      # Host of bcastEntryPackageUrl in the BALD.
      BCAST_HOSTNAME: ${BCAST_HOSTNAME:-bcast}
      # Fixed ids: every restart publishes again on the same topic.
      BSID:           tv30-default
      WEBMEDIA_SID:   urn:tv30:service:webmedia
      UFF_SID:        urn:tv30:service:uff
      EDUPLAY_SID:    urn:tv30:service:eduplay
      # Paths on the remote device of the webmedia demo (.env.example).
      WEBMEDIA_REMOTE_MEDIA_PATH:     ${WEBMEDIA_REMOTE_MEDIA_PATH:-}
      WEBMEDIA_REMOTE_USERFILES_PATH: ${WEBMEDIA_REMOTE_USERFILES_PATH:-}
    volumes:
      # public/ (media) is outside the image (.dockerignore) and is served from
      # here.
      - ./bcast/public:/app/public:ro
    depends_on:
      - mosquitto
    restart: unless-stopped
