# TV30 — Compose unificado (raiz da solucao)
#
# LINUX (full-container):  docker compose up -d
#   Defaults vem de .env (COMPOSE_PROFILES=mqtt,linux + DOCKERHUB_NS, IMAGE_TAG, EDGE_VARIANT)
#
# DESENVOLVIMENTO (infra em containers + um modulo rodando no host com
# npm run dev): ver docs/dev-local.md e scripts/test-dev-host.sh. Windows
# nativo (modulo no PowerShell com Docker no WSL) nao e coberto.

# Nome fixo do projeto: independe da pasta onde o repo foi clonado.
# (Evita containers "orfaos" quando dois clones/paths diferentes rodam o
# mesmo stack — down/up sempre alcancam os mesmos containers.)
name: tv30

include:
  - infra/docker-compose.yml

services:

  # Diagnostico pre-subida (nunca bloqueia): checa DNS e portas do stack e
  # imprime avisos legiveis ANTES dos servicos subirem. Roda com rede+pid do
  # host para enxergar quem esta segurando cada porta.
  preflight:
    image: alpine:3
    container_name: tv30-preflight
    network_mode: host
    pid: host
    environment:
      # Perfis ativos, para as checagens que so valem com um perfil ligado
      # (ssdp: UDP 1900). Vem do .env da raiz ou do shell; perfil ligado so
      # por --profile na linha de comando nao aparece aqui.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - ./scripts/preflight.sh:/preflight.sh:ro
    command: sh /preflight.sh
    restart: "no"

  # Semeia ./user-files do template na primeira subida (idempotente).
  # Elimina o pre-requisito manual de criar a pasta antes do compose up.
  userfiles-seed:
    image: alpine:3
    container_name: tv30-userfiles-seed
    volumes:
      - ./user-files:/user-files
      - ./infra/user-files-template:/template:ro
      - ./scripts/seed-user-files.sh:/seed.sh:ro
    command: sh /seed.sh
    restart: "no"

  # MOTIVO (registro do item 1 da lista de trabalho): em alguns kernels
  # Linux, com br_netfilter ativo, o trafego entre containers na bridge
  # passa pelas regras iptables do HOST e e interceptado/dropado — sintoma
  # observado: MQTT/Redis intermitentes entre os servicos. O ajuste
  # net.bridge.bridge-nf-call-iptables=0 impede essa interceptacao
  # (fonte: infra/README.md; nao reproduzido em bancada — para testar a
  # remocao, subir a stack sem este servico e observar a estabilidade de
  # MQTT/Redis no kernel afetado). Em hosts com sysctl read-only (ex.:
  # Docker Desktop) o comando falha de proposito em silencio (|| echo),
  # por isso a saida e sempre 0 — um no-op silencioso e indistinguivel de
  # sucesso.
  sysctl-init:
    profiles: ["linux"]
    image: alpine:3
    container_name: tv30-sysctl-init
    privileged: true
    network_mode: host
    command: >
      sh -c "sysctl -w net.bridge.bridge-nf-call-iptables=0 2>/dev/null || echo 'sysctl skipped (read-only or unsupported kernel)'"
    restart: "no"

  tv3ws:
    profiles: ["linux"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-tv3ws:${IMAGE_TAG:-dev}
    build:
      context: ./tv3ws
      dockerfile: ../infra/dockerfiles/tv3ws.Dockerfile
      additional_contexts:
        tv30-data:    ./infra/user-files-template
        tv30-scripts: ./infra/dockerfiles
    container_name: tv3ws
    networks: [ginga_net]
    ports:
      # As portas de API (44652/44653) NAO sao publicadas no host: todo
      # acesso de cliente passa pelo edgegateway (44642/44643). Quem entrava
      # por elas nao tinha credencial validada (defeito 6 da vacina).
      #
      # WebSockets de remote-device usam portas dinamicas nesse range. Tem
      # que estar publicado no host pra apps externas alcancarem a URL que o
      # tv3ws devolve no registro (ws://SERVER_URL:<porta>).
      - "45000-45199:45000-45199"
    environment:
      MQTT_HOST: mosquitto
      HTTP_PORT: 44652
      HTTPS_PORT: 44653
      # Host que apps externas usam pra abrir o websocket devolvido no
      # registro em /tv3/remote-device. Tem que bater com o IP/hostname
      # alcancavel de fora do container (nao localhost/nome-de-servico).
      # Configuravel via .env da raiz; localhost atende demo em maquina unica.
      SERVER_URL: ${SERVER_URL:-localhost}
      # Range de portas pros websockets de remote-device. Tem que coincidir
      # com o range publicado em `ports` acima.
      WS_PORT_MIN: 45000
      WS_PORT_MAX: 45199
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_DATA_FILE: /user-files/userData.json
      USER_THUMBS:    /user-files/thumbs
      # Default de dev: permite subir em maquina virgem sem tv3ws/.env.
      # Override: JWT_SECRET no .env da RAIZ (ou no shell) — a secao
      # `environment` tem precedencia sobre env_file, entao JWT_SECRET em
      # tv3ws/.env NAO tem efeito.
      JWT_SECRET: ${JWT_SECRET:-tv30-dev-secret-nao-usar-em-producao}
      # Emissor do accessToken. Mesma fonte (.env da raiz / shell) e mesmo
      # padrao que a borda usa para validar o token (infra/docker-compose.yml).
      JWT_ISSUER: ${JWT_ISSUER:-GenericIssuer}
      # Descoberta SSDP: no compose quem anuncia e o tv3ws-ssdp (perfil ssdp,
      # rede do host; L6 = opcao B, informado pelo Luis em 04/10). Daqui, da
      # bridge, o multicast nao sai para a LAN. O tv3ws so serve o /manifest.
      SSDP_ENABLED: "false"
    env_file:
      # Opcional: HTTPS_KEY/HTTPS_CERT proprios (fora da imagem; nao estao
      # na secao environment, entao valem daqui). Ausente => tv3ws sobe so
      # em HTTP.
      - path: ./tv3ws/.env
        required: false
      # Endereco do anuncio SSDP (SSDP_ADVERTISE_HOST, EDGE_HTTP_PORT,
      # EDGE_HTTPS_PORT): o /manifest daqui e o LOCATION do tv3ws-ssdp tem de
      # sair do mesmo valor, entao os dois servicos leem os mesmos arquivos,
      # nesta ordem (o de baixo prevalece): tv3ws/.env e o .env da raiz.
      # Essas variaveis ficam fora da secao environment de proposito: la, ate
      # vazio (SSDP_ADVERTISE_HOST: ${SSDP_ADVERTISE_HOST:-}), o valor
      # sobrescreveria o do tv3ws/.env, onde ele valia ate aqui (medido em
      # 04/10, compose v5.4.0). Valor so exportado no shell nao chega por
      # este caminho. Efeito colateral: as outras chaves do .env da raiz entram
      # no ambiente do container; as do .env.example que o tv3ws le
      # (SERVER_URL, JWT_SECRET, JWT_ISSUER) ja estao na secao environment,
      # que prevalece.
      - path: ./.env
        required: false
    volumes:
      - ./user-files:/user-files
    depends_on:
      # redis so fica healthy APOS a carga inicial (chave seed:done) — isso
      # substitui o antigo container redis-seed + service_completed_successfully.
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      userfiles-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # Anunciante SSDP (C.3.4). L6 decidida = opcao B (informado pelo Luis em
  # 04/10): container so para o anuncio, em rede do host, porque o multicast
  # da bridge nao sai para a LAN (docs/ssdp-verificacao.md). Mesma imagem do
  # tv3ws (construida pelo servico tv3ws), outro programa
  # (dist/ssdp-announcer.js): sem Express, Redis nem MQTT, sem porta TCP. O
  # LOCATION aponta para o /manifest do tv3ws, atras da borda. Sem volume de
  # user-files, o entrypoint da imagem so executa o comando.
  # So funciona em Linux nativo com Docker Engine (decisao do Joel, 04/10):
  # em Windows/WSL2 o anuncio nao sai da maquina (medido); no Docker Desktop,
  # que tambem roda numa VM, espera-se o mesmo (nao medido). Liga com o
  # perfil "ssdp" (ex.: COMPOSE_PROFILES=mqtt,linux,ssdp). Na linha de comando,
  # --profile substitui o COMPOSE_PROFILES do .env (medido em 04/10): use
  # --profile mqtt --profile linux --profile ssdp; so --profile ssdp sobe a
  # infra e o anunciante, sem tv3ws, aop e bcast.
  # Morre-inteiro: falha do anuncio derruba so este container (exit 1 e
  # restart), nao as APIs do tv3ws.
  tv3ws-ssdp:
    profiles: ["ssdp"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-tv3ws:${IMAGE_TAG:-dev}
    container_name: tv3ws-ssdp
    network_mode: host
    command: ["node", "dist/ssdp-announcer.js"]
    environment:
      # Mesmo valor do tv3ws: sem SSDP_ADVERTISE_HOST, e o host anunciado.
      SERVER_URL: ${SERVER_URL:-localhost}
    env_file:
      # Os mesmos arquivos do tv3ws, na mesma ordem (motivo no servico tv3ws):
      # SSDP_ADVERTISE_HOST, EDGE_HTTP_PORT/EDGE_HTTPS_PORT e UDN, mais
      # SSDP_INTERFACE (nome da interface que anuncia; sem ela, a que tem o IP
      # anunciado ou, com aviso, a da rota padrao).
      - path: ./tv3ws/.env
        required: false
      - path: ./.env
        required: false
    depends_on:
      # O LOCATION aponta para a borda: nao anunciar antes de ela existir.
      # Nao depende do tv3ws (perfil linux), que no cenario dev-host 1 roda
      # fora do compose e anuncia sozinho (SSDP_ENABLED ligado). Com este
      # container de pe ficariam dois anunciantes, e o LOCATION daqui pode
      # nao casar com o /manifest do tv3ws do host, que nao le o .env da
      # raiz: scripts/test-dev-host.sh para este container no cenario 1
      # (docs/dev-local.md).
      edgegateway:
        condition: service_started
    restart: unless-stopped

  aop:
    profiles: ["linux"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-aop:${IMAGE_TAG:-dev}
    build:
      context: ./aop
      dockerfile: ../infra/dockerfiles/aop.Dockerfile
      additional_contexts:
        tv30-data:    ./infra/user-files-template
        tv30-scripts: ./infra/dockerfiles
    container_name: aop
    networks: [ginga_net]
    extra_hosts:
      # O aop faz proxy HTTP direto ao bcast (/graphicsAppProxy,
      # /videoStreamProxy -> bcastEntryPackageUrl). Com o bcast rodando no
      # HOST (desenvolvimento, BCAST_HOSTNAME=host.docker.internal) o nome
      # precisa resolver em Linux; inocuo no deploy padrao.
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MQTT_HOST: mosquitto
      # Browser conecta ws://localhost:${MQTT_WS_PORT}/mqtt do HOST. Por isso
      # tem que bater com a porta exposta pelo Mosquitto no host (9003 no
      # docker-compose.yml da infra — escapando do Windows WSL mirrored).
      MQTT_WS_PORT: 9001
      USER_DATA_PATH: /user-files
      # A plataforma le perfis e escreve a lista de origens associadas
      # DIRETO no Redis (P1) — nao passa mais pela porta HTTP do tv3ws.
      REDIS_HOST: redis
    volumes:
      - ./user-files:/user-files
    depends_on:
      - mosquitto
      - redis
      - userfiles-seed
    restart: unless-stopped

  bcast:
    profiles: ["linux"]
    image: ${DOCKERHUB_NS:-tv30}/tv30-bcast:${IMAGE_TAG:-dev}
    build:
      context: ./bcast
      dockerfile: ../infra/dockerfiles/bcast.Dockerfile
    container_name: bcast
    networks: [ginga_net]
    ports:
      # Default 8081 no host. Se a porta estiver ocupada, sobrescreva
      # BCAST_PORT no .env (a porta DENTRO do container continua 8081 — o
      # AoP usa o DNS interno "bcast:8081" e nao depende disso).
      - "${BCAST_PORT:-8081}:8081"
    environment:
      PORT: 8081
      MQTT_HOST: mosquitto
      # Hostname pra construir bcastEntryPackageUrl na BALD. AoP faz proxy
      # pra esse host — em Docker precisa ser o service-name (resolve via
      # ginga_net DNS), nao localhost. Override so pro desenvolvimento com o
      # aop no HOST (BCAST_HOSTNAME=localhost: o aop do host alcanca a porta
      # publicada 8081) — ver docs/dev-local.md.
      BCAST_HOSTNAME: ${BCAST_HOSTNAME:-bcast}
      # IDs fixos: cada restart re-publica no MESMO topico, sobrescrevendo o
      # anterior em vez de criar tópicos orfaos retidos no broker.
      BSID:           tv30-default
      WEBMEDIA_SID:   urn:tv30:service:webmedia
      UFF_SID:        urn:tv30:service:uff
      EDUPLAY_SID:    urn:tv30:service:eduplay
      # Caminhos no dispositivo remoto do demo webmedia (ver .env.example).
      WEBMEDIA_REMOTE_MEDIA_PATH:     ${WEBMEDIA_REMOTE_MEDIA_PATH:-}
      WEBMEDIA_REMOTE_USERFILES_PATH: ${WEBMEDIA_REMOTE_USERFILES_PATH:-}
    volumes:
      # public/ (templates estaticos + media, ~2.3GB) fica FORA da imagem:
      # nao entra no build (.dockerignore) e e servido daqui via
      # express.static('public'). Editar arquivos em bcast/public reflete
      # sem rebuild. :ro porque o servico so le esse conteudo.
      - ./bcast/public:/app/public:ro
    depends_on:
      - mosquitto
    restart: unless-stopped
