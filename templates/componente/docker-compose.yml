# Compose template for a NEW TV30 component; see the README.md next to it.
# Replace "meu-componente", port 8090 and the variables with yours. As it
# comes, it starts the EXAMPLE component (Dockerfile and index.js next to
# it: it talks to Redis and to the broker by service name and exposes
# /health).
#
# Usage, with the root stack already up (the ginga_net network must exist):
#   cp -r templates/componente <component-folder>
#   docker compose --env-file <TV30-root>/.env \
#     -f <component-folder>/docker-compose.yml up -d --build
# (--env-file makes the root .env apply here: without it, compose reads the
# .env of the component folder)
#
# A project separate from "tv30": `docker compose down` in the root does not
# bring this component down, and vice versa.
name: tv30-meu-componente

services:
  meu-componente:
    image: ${DOCKERHUB_NS:-tv30}/tv30-meu-componente:${IMAGE_TAG:-dev}
    build:
      context: .
    container_name: meu-componente
    networks: [ginga_net]
    # If the main process exits, the container exits and Docker restarts it.
    # A component with more than one process needs a supervisor that brings
    # everything down when any of them exits (model:
    # infra/edgegateway/entrypoint.sh).
    restart: unless-stopped
    # Minimal Docker init as PID 1, with the process as its child: forwards the
    # SIGTERM of `docker stop` and, if the process dies by a signal, exits with
    # the same code.
    init: true
    extra_hosts:
      # Reaches a service running on the host (e.g. another module in npm run
      # dev) by host.docker.internal, also on Linux.
      - "host.docker.internal:host-gateway"
    environment:
      # Inside ginga_net the services find each other by service name, never by
      # localhost (localhost is the container itself).
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8090
      # Only for the example (index.js): test topic and key. The defaults
      # derive from the component name: tv30/<name>/exemplo and
      # tv30:<name>:exemplo.
      # EXEMPLO_TOPICO: tv30/meu-componente/exemplo
      # EXEMPLO_CHAVE: tv30:meu-componente:exemplo
      # A new component does not validate credentials: the edge (tv30-auth
      # plugin) validates the access token and the bind-token. A new route of
      # the standard goes in infra/edgegateway/routes.json with auth and
      # classes. Only if the component issues an accessToken, use the same
      # source as tv3ws and the edge (root .env or shell):
      # JWT_SECRET: ${JWT_SECRET:-tv30-dev-secret-nao-usar-em-producao}
      # JWT_ISSUER: ${JWT_ISSUER:-GenericIssuer}
    ports:
      # Publish only what a client outside Docker needs. Clients of the APIs of
      # the standard come in through the edge (44642/44643), not by a port of
      # their own.
      - "${MEU_COMPONENTE_PORT:-8090}:8090"
    # depends_on does not reach services of another compose project: the
    # component must tolerate a broker or Redis still starting (retry, or exit
    # with an error and let the restart bring it back; the example exits with
    # an error).
    # healthcheck: the /health of the example opens only with Redis and the
    # broker connected (wget is the busybox one of the alpine image).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # Network created by the root stack (infra/docker-compose.yml). external:
  # the component joins it, without creating its own.
  ginga_net:
    external: true
    name: ginga_net
