title: TV 3.0 — Plataforma de Referência
description: Documentação técnica do monorepo TV30 (multisens), para alunos novos e desenvolvedores

# Tema via remote_theme (suportado pelo GitHub Pages sem precisar instalar localmente)
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

# Configurações do just-the-docs
search_enabled: true
heading_anchors: true
color_scheme: dark

# Navegação: as seções (Primeiros passos, Como funciona) são páginas com
# has_children; a ordem de cada página vem do nav_order dela.

# Avisos em destaque. Uso no Markdown: uma linha "{: .nota }" logo antes
# do parágrafo (ou do bloco "> ...") do aviso.
callouts:
  nota:
    title: Norma × implementação
    color: blue

aux_links:
  "Repositório":
    - "https://github.com/multisens/TV30"
  "Spec ABNT NBR 25608":
    - "https://www.abntcatalogo.com.br/"

# Footer
footer_content: 'CEFET-RJ — Projeto Multisens / TV 3.0'

# Excluir do build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
