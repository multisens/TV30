title: TV30 — testbed aberto da camada de Codificação de Aplicações da TV 3.0
description: Documentação técnica do monorepo TV30 (multisens), para alunos novos e desenvolvedores

# Theme by remote_theme (supported by GitHub Pages without a local install).
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

# just-the-docs settings.
search_enabled: true
heading_anchors: true
color_scheme: dark

# Navigation: the sections (Primeiros passos, Como funciona) are pages with
# has_children; the order of each page comes from its nav_order.

# Highlighted notes. In Markdown: a line "{: .nota }" right before the
# paragraph (or the "> ..." block) of the note.
callouts:
  nota:
    title: Norma × implementação
    color: blue

aux_links:
  "Repositório":
    - "https://github.com/multisens/TV30"
  "Spec ABNT NBR 25608":
    - "https://www.abntcatalogo.com.br/"

# Footer.
footer_content: 'CEFET-RJ — Projeto Multisens / TV 3.0'

# Excluded from the build.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
